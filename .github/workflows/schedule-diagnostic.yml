name: Schedule trigger diagnostic

on:
  schedule:
    # Keep this in UTC and away from the top of the hour so it is independent
    # from timezone-aware scheduling and GitHub's busiest scheduling window.
    - cron: "37 0,6,12,18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Record trigger context
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "utc_now=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "event_name=$EVENT_NAME"
          echo "schedule=$SCHEDULE"
          echo "head_sha=$HEAD_SHA"
